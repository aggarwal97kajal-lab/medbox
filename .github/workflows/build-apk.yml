# Builds the Android APK in the cloud on every push and publishes it as a
# GitHub Release, so it can be downloaded and installed straight from a phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add Android project files
        run: |
          flutter create . --project-name medbox --org in.medbox --platforms android
          rm -f test/widget_test.dart
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $MANIFEST
          sed -i 's/android:label="medbox"/android:label="MedBox"/' $MANIFEST

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MedBox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedBox-apk
          path: MedBox.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedBox build ${{ github.run_number }}
          body: Download MedBox.apk below and open it on your Android phone to install.
          files: MedBox.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash .github/smoke.sh

      - name: Pack emulator results
        if: always()
        run: |
          mkdir -p smoke
          cd smoke && zip -q ../smoke-test.zip * || true

      - name: Attach emulator results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: smoke-test.zip
